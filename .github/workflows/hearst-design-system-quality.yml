name: Hearst design system quality

on:
  pull_request:
    paths:
      - "hearst-design-system/**"
      - ".github/workflows/hearst-design-system-quality.yml"
  push:
    branches:
      - main
    paths:
      - "hearst-design-system/**"
      - ".github/workflows/hearst-design-system-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hearst-design-system-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # The checked-in visual baselines are reviewed macOS Chromium captures.
    # Keep CI on the same rendering platform so font rasterization and page
    # metrics remain deterministic instead of comparing Linux pixels to macOS.
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hearst-design-system

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hearst-design-system/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run token, unit, Storybook, carousel, and visual checks
        run: npm run quality

      - name: Build the application
        run: npm run build
