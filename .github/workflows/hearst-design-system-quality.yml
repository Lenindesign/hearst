name: Hearst design system quality

on:
  pull_request:
    paths:
      - "hearst-design-system/**"
      - ".github/workflows/hearst-design-system-quality.yml"
  push:
    branches:
      - main
    paths:
      - "hearst-design-system/**"
      - ".github/workflows/hearst-design-system-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hearst-design-system-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # The checked-in visual baselines are reviewed macOS Chromium captures.
    # Keep CI on the same rendering platform so font rasterization and page
    # metrics remain deterministic instead of comparing Linux pixels to macOS.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hearst-design-system

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hearst-design-system/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      # The visual screenshot cases render the frozen feed edition in
      # tests/visual-fixtures/, so a daily feed refresh never changes them.
      - name: Run token, unit, Storybook, carousel, visual, and responsive checks
        run: npm run quality:ci

      # A failing visual case writes its capture here. Download the artifact to
      # review it and, when the new render is correct, adopt it as the baseline.
      - name: Upload failing visual captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-actuals
          path: hearst-design-system/output/playwright/visual-regression/
          if-no-files-found: ignore

      - name: Build the application
        run: npm run build
