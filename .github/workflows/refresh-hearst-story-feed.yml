name: Refresh Hearst story feed

on:
  schedule:
    # 10:15 UTC is early morning in the United States, before the daily reader edition.
    - cron: "15 10 * * *"
  workflow_dispatch:

# main is protected by the "Protect main" ruleset, so the bot pushes to its own
# branch and opens (or updates) a pull request for the owner to approve.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-hearst-story-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hearst-design-system

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hearst-design-system/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Import current public RSS stories
        run: npm run feed:refresh

      - name: Validate inventory and freshness
        run: npm run feed:validate

      - name: Verify the application build
        run: npm run build

      - name: Open a pull request with the new daily edition
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/daily-story-feed
        run: |
          git config user.name "hearst-feed-bot"
          git config user.email "hearst-feed-bot@users.noreply.github.com"
          git add \
            src/components/lifestyle-river-data.ts \
            src/components/autos-river-data.ts \
            src/components/flux-river-data.ts \
            src/components/ew-river-data.ts \
            src/stories/generated/hearst-plus-fixtures.ts \
            src/components/hearst-feed-source-index.json \
            daily-story-counts.md
          if git diff --cached --quiet; then
            echo "No story changes to publish."
            exit 0
          fi
          EDITION="$(date -u +%Y-%m-%d)"
          git switch -c "$BRANCH"
          git commit -m "chore: refresh daily Hearst story feed ($EDITION)"
          # One rolling branch: each run replaces the previous unmerged edition.
          git push --force origin "$BRANCH"
          BODY="Daily story feed refresh for $EDITION, built and validated by the scheduled workflow (feed:validate and next build passed). Approve and merge to publish. If a newer edition arrives first, this PR is updated in place."
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "Daily story feed: $EDITION" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "Daily story feed: $EDITION" --body "$BODY"
          fi
