[build]
  base = "hearst-design-system"
  command = "npm run build && npx storybook build -o \"$PWD/.next/static/sb\" --quiet && node scripts/fix-storybook-paths.mjs"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Every spec is a chapter of the single specifications page (/specs/). Old spec URLs open
# the page at their chapter; force overrides the static .html files that used to live there.
[[redirects]]
  from = "/cta-specs"
  to = "/specs/#cta"
  status = 301
  force = true

[[redirects]]
  from = "/layout-specs"
  to = "/specs/#layout"
  status = 301
  force = true

[[redirects]]
  from = "/type-specs"
  to = "/specs/#type"
  status = 301
  force = true

[[redirects]]
  from = "/token-specs"
  to = "/specs/#tokens"
  status = 301
  force = true

[[redirects]]
  from = "/specs/blocks-spec.html"
  to = "/specs/#blocks"
  status = 301
  force = true

[[redirects]]
  from = "/specs/nav-spec.html"
  to = "/specs/#nav"
  status = 301
  force = true

[[redirects]]
  from = "/specs/reader-spec.html"
  to = "/specs/#reader"
  status = 301
  force = true

[[redirects]]
  from = "/specs/carousel-spec.html"
  to = "/specs/#carousel"
  status = 301
  force = true

[[redirects]]
  from = "/specs/system-spec.html"
  to = "/specs/#system"
  status = 301
  force = true

# When the UI is at /storybook/, Storybook fetches ./index.json → /storybook/index.json.
# A catch-all /storybook/* → index.html makes that URL return HTML → JSON.parse throws.
# Map JSON + iframe first; only then serve the HTML shell.
#
# Do not 301 /storybook → /storybook/: on some Netlify stacks that matches /storybook/ and
# redirects to itself (infinite 301). Serve both paths with 200 rewrites; built HTML includes
# <base href="/storybook/"> so relative index.json resolves under /storybook/ even at /storybook.
# Spec drawings and films copied in by Storybook staticDirs (public/specs → sb/specs).
# Stories reference them relatively, which resolves under <base href="/storybook/">.
[[redirects]]
  from = "/storybook/specs/*"
  to = "/_next/static/sb/specs/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/storybook/index.json"
  to = "/_next/static/sb/index.json"
  status = 200
  force = true

[[redirects]]
  from = "/storybook/iframe.html"
  to = "/_next/static/sb/iframe.html"
  status = 200
  force = true

[[redirects]]
  from = "/storybook/build-info.json"
  to = "/_next/static/sb/build-info.json"
  status = 200
  force = true

[[redirects]]
  from = "/storybook"
  to = "/_next/static/sb/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/storybook/"
  to = "/_next/static/sb/index.html"
  status = 200
  force = true

# Canonical URL for bookmarks that still use the static output path directly.
[[redirects]]
  from = "/_next/static/sb/index.html"
  to = "/storybook/"
  status = 301
  force = true

[[redirects]]
  from = "/_next/static/sb"
  to = "/storybook/"
  status = 301
  force = true

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/sb/index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/sb/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/sb/iframe.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/sb/build-info.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
